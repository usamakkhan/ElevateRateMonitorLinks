name: Refresh domain manifest
on:
  workflow_dispatch:
    inputs:
      domain:
        description: New HTTPS domain
        required: false
        type: string
  repository_dispatch:
    types: [elevate_domain_changed]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and update domain
        env:
          NEW_DOMAIN: ${{ github.event.client_payload.domain || inputs.domain || '' }}
        run: python3 tools/update_domain.py
      - name: Commit a changed manifest
        run: |
          if git diff --quiet -- docs/domain.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/domain.json
          git commit -m "Update Elevate domain manifest"
          git push
